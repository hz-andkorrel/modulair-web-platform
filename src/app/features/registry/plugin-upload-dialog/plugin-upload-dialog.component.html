<div class="upload-container">
  <h2>Upload Plugin</h2>
  <div class="upload-plugin">
    <button mat-raised-button color="primary" (click)="fileInput.click()">
      <mat-icon>upload</mat-icon>
      Upload Plugin
    </button>
    <input #fileInput type="file" hidden (change)="onPluginUpload($event)" />
  </div>
</div>
