<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="logo-container">
        <mat-icon class="logo-icon">hotel</mat-icon>
      </div>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to continue to Hotel Hub</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="username" type="email" autocomplete="email" #emailInput>
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched">
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('username')?.hasError('username')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput
                 [type]="hidePassword() ? 'password' : 'text'"
                 formControlName="password"
                 autocomplete="current-password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix
                  (click)="hidePassword.set(!hidePassword())"
                  type="button"
                  [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hidePassword()">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            Password is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <div class="remember-me">
          <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>
        </div>

        <div class="error-message" *ngIf="error()">
          <mat-icon>error</mat-icon>
          <span>{{ error() }}</span>
        </div>

        <button mat-raised-button
                color="primary"
                type="submit"
                class="full-width login-button"
                [disabled]="loginForm.invalid || loading()">
          <mat-spinner diameter="20" *ngIf="loading()"></mat-spinner>
          <span *ngIf="!loading()">Sign In</span>
        </button>

        <div class="forgot-password-link">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <div class="register-link">
          Don't have an account?
          <a routerLink="/register">Register here</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
