<!-- Settings component content -->
<div class="settings-container">
  <div class="sheet">
  <h1>Settings</h1>

  <!-- Admin Section -->
  <div class="settings-section">
    <h2>Administration</h2>
    <div class="settings-cards">
      <mat-card class="settings-card" routerLink="/settings/users">
        <mat-card-header>
          <mat-icon class="card-icon">people</mat-icon>
          <mat-card-title>User Management</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          Create, edit, and manage user accounts and roles
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary">
            Manage Users
            <mat-icon>arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <!-- Hotel Settings Section -->
  <div class="settings-section">
    <h2>Hotel Information</h2>
  
  <div class="settings-box">
    <label for="hotel-name">Hotelnaam</label>
    <input id="hotel-name" name="hotelName" type="text" class="settings-input" placeholder="Vul hotelnaam in" aria-label="Hotelnaam">
  </div>

  <div class="settings-box">
    <label for="hotel-description">Hotelbeschrijving</label>
    <textarea id="hotel-description" name="hotelDescription" class="settings-textarea" rows="4" placeholder="Beschrijf het hotel" aria-label="Hotelbeschrijving"></textarea>
  </div>

  <div class="settings-box">
    <label for="hotel-address">Hoteladres</label>
    <textarea id="hotel-address" name="hotelAddress" class="settings-textarea" rows="2" placeholder="Straat, postcode, stad" aria-label="Hoteladres"></textarea>
  </div>

  <div class="settings-box">
    <label for="hotel-contact">Hotelcontactgegevens</label>
    <input id="hotel-contact" name="hotelContact" type="text" class="settings-input" placeholder="Telefoon en/of e-mail" aria-label="Hotelcontactgegevens">
  </div>

  <div class="settings-box">
    <span>Incheck- en uitchecktijden</span>
    <div class="check-times">
      <label for="check-in">Incheck</label>
      <input id="check-in" name="checkIn" type="time" class="settings-time" aria-label="Inchecktijd">
      <label for="check-out">Uitcheck</label>
      <input id="check-out" name="checkOut" type="time" class="settings-time" aria-label="Uitchecktijd">
    </div>
  </div>
  <button mat-raised-button color="primary" class="save-button" aria-label="Instellingen opslaan">Opslaan</button>
  </div>
</div>
</div>
